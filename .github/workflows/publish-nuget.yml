name: Публикация по тегу v

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  DOTNET_SDK_VERSION: 11.0.100
  TERRARIA_RUNTIME_TFM: net11.0

jobs:
  publish:
    name: Build, validate and publish TerrariaRuntime
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build TerrariaRuntime patcher
        run: dotnet build src/TerrariaRuntime.Patcher/TerrariaRuntime.Patcher.csproj

      - name: Patch Terraria server and create TerrariaRuntime.nupkg
        working-directory: src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}
        run: dotnet TerrariaRuntime.Patcher.dll

      - name: Validate server startup
        run: |
          dotnet build src/TerrariaRuntime.Server.Launcher/TerrariaRuntime.Server.Launcher.csproj
          dotnet src/TerrariaRuntime.Server.Launcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}/TerrariaRuntime.Server.Launcher.dll -test-init

      - name: Validate generated hooks and allocation-free unobserved path
        run: dotnet run --project tests/HookEmitterSmoke/HookEmitterSmoke.csproj -c Release -p:RuntimeAssemblyPath="${{ github.workspace }}/src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}/TerrariaRuntime.dll"

      - name: Verify tag and package version
        shell: bash
        run: |
          package="src/TerrariaRuntime.Patcher/bin/Debug/${TERRARIA_RUNTIME_TFM}/TerrariaRuntime.nupkg"
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(unzip -p "$package" TerrariaRuntime.nuspec | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p')"
          test "$package_version" = "$tag_version"

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: kidlok

      - name: Publish TerrariaRuntime
        run: >-
          dotnet nuget push
          src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}/TerrariaRuntime.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://www.nuget.org/api/v2/package
