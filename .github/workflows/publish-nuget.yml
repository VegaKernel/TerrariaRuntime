name: Публикация по тегу v

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

env:
  DOTNET_SDK_VERSION: 11.0.100-preview.7.26381.103
  OTAPI_TFM: net11.0

jobs:
  publish:
    name: Build, validate and publish OTAPI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Build OTAPI patcher
        run: dotnet build src/OTAPI.Patcher/OTAPI.Patcher.csproj

      - name: Patch Terraria server and create OTAPI.nupkg
        working-directory: src/OTAPI.Patcher/bin/Debug/${{ env.OTAPI_TFM }}
        run: dotnet OTAPI.Patcher.dll

      - name: Validate server startup
        run: |
          dotnet build src/OTAPI.Server.Launcher/OTAPI.Server.Launcher.csproj
          dotnet src/OTAPI.Server.Launcher/bin/Debug/${{ env.OTAPI_TFM }}/OTAPI.Server.Launcher.dll -test-init

      - name: Verify tag and package version
        shell: bash
        run: |
          package="src/OTAPI.Patcher/bin/Debug/${OTAPI_TFM}/OTAPI.nupkg"
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(unzip -p "$package" OTAPI.nuspec | sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p')"
          test "$package_version" = "$tag_version"

      - name: Authenticate to NuGet.org with Trusted Publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: kidlok

      - name: Publish OTAPI
        run: >-
          dotnet nuget push
          src/OTAPI.Patcher/bin/Debug/${{ env.OTAPI_TFM }}/OTAPI.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://www.nuget.org/api/v2/package
