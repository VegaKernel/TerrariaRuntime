name: CI

on:
  push:
    branches: [ upcoming, agent/net11-migration ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SDK_VERSION: 11.0.100-preview.7.26381.103
  OTAPI_TFM: net11.0

jobs:
  Server:
    strategy:
      fail-fast: false
      matrix:
        os: [
          {
            name: Windows,
            runs-on: windows-latest,
          },
          {
            name: Ubuntu,
            runs-on: ubuntu-latest,
          },
          {
            name: MacOS,
            runs-on: macos-latest,
          }
        ]
        profile: [
          {
            name: PC,
            patch_target: p,
            package_path: OTAPI.PC.nupkg,
          },
        ]

    runs-on: ${{ matrix.os.runs-on }}
    name: ${{ matrix.os.name }} ${{ matrix.profile.name }} Server

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Server patch
        run: |
          dotnet build OTAPI.Mods.slnf
          cd OTAPI.Patcher/bin/Debug/${{ env.OTAPI_TFM }}
          dotnet run --project ../../../OTAPI.Patcher.csproj -patchTarget=${{ matrix.profile.patch_target }} -latest=n --framework ${{ env.OTAPI_TFM }}

      - name: Server boot
        run: |
          dotnet build OTAPI.Server.Launcher.slnf
          cd OTAPI.Server.Launcher/bin/Debug/${{ env.OTAPI_TFM }}
          dotnet OTAPI.Server.Launcher.dll -test-init

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }} ${{ matrix.profile.name }} NuGet Package
          path: OTAPI.Patcher/bin/Debug/${{ env.OTAPI_TFM }}/${{ matrix.profile.package_path }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }} ${{ matrix.profile.name }} Binaries
          path: |
            OTAPI.Patcher/bin/Debug/${{ env.OTAPI_TFM }}/artifact-*/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }} ${{ matrix.profile.name }} Wiki MD files
          path: OTAPI.Patcher/bin/Debug/${{ env.OTAPI_TFM }}/*.mfw.md
