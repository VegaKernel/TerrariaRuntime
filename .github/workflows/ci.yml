name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_SDK_VERSION: 11.0.100
  TERRARIA_RUNTIME_TFM: net11.0

jobs:
  Server:
    strategy:
      fail-fast: false
      matrix:
        os: [
          {
            name: Windows,
            runs-on: windows-latest,
          },
          {
            name: Ubuntu,
            runs-on: ubuntu-latest,
          },
          {
            name: MacOS,
            runs-on: macos-latest,
          }
        ]

    runs-on: ${{ matrix.os.runs-on }}
    name: ${{ matrix.os.name }} Server

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Server patch
        run: |
          dotnet build src/TerrariaRuntime.Patcher/TerrariaRuntime.Patcher.csproj
          cd src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}
          dotnet TerrariaRuntime.Patcher.dll

      - name: Server boot
        run: |
          dotnet build src/TerrariaRuntime.Server.Launcher/TerrariaRuntime.Server.Launcher.csproj
          cd src/TerrariaRuntime.Server.Launcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}
          dotnet TerrariaRuntime.Server.Launcher.dll -test-init

      - name: Generated hook semantics and allocation smoke
        run: dotnet run --project tests/HookEmitterSmoke/HookEmitterSmoke.csproj -c Release -p:RuntimeAssemblyPath="${{ github.workspace }}/src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}/TerrariaRuntime.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }} NuGet Package
          path: src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}/TerrariaRuntime.nupkg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }} Binaries
          path: |
            src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}/artifact-*/*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os.name }} Wiki MD files
          path: src/TerrariaRuntime.Patcher/bin/Debug/${{ env.TERRARIA_RUNTIME_TFM }}/*.patch.md
